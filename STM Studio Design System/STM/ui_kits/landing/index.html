<!-- @dsCard group="Landing page" viewport="1440x900" name="STM Studio landing" subtitle="Desktop · EN / Arabic RTL · mobile · Direction B" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>STM Studio — landing page</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./copy.js"></script>
<style>body{margin:0;background:#0F0E0D}#root{min-height:100vh}
.stm-switch{position:fixed;top:14px;right:14px;z-index:50;display:flex;gap:1px;background:rgba(242,240,236,.16);border:1px solid rgba(242,240,236,.16)}
.stm-switch button{font-family:var(--stm-font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:8px 12px;border:0;cursor:pointer;background:#1F1E1C;color:#8E8A84}
.stm-switch button[data-on="1"]{background:#D52027;color:#fff}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="./Landing.jsx"></script>
<script type="text/babel" src="./LandingMobile.jsx"></script>
<script type="text/babel" src="./DirectionB.jsx"></script>
<script type="text/babel" data-presets="react">
function App(){
  const [view,setView]=React.useState('desktop');
  const [lang,setLang]=React.useState('en');
  const views=[['desktop','Desktop'],['mobile','Mobile'],['dirB','Direction B']];
  return <>
    <div className="stm-switch">
      {views.map(([k,l])=><button key={k} data-on={view===k?'1':'0'} onClick={()=>setView(k)}>{l}</button>)}
      {view!=='dirB' && <button data-on={lang==='ar'?'1':'0'} onClick={()=>setLang(lang==='ar'?'en':'ar')}>{lang==='ar'?'ع':'EN'}</button>}
    </div>
    {view==='desktop' && <Landing lang={lang} onLang={setLang} />}
    {view==='mobile' && <div style={{padding:'30px 0',display:'flex',justifyContent:'center'}}><LandingMobile lang={lang} onLang={setLang} /></div>}
    {view==='dirB' && <DirectionB />}
  </>;
}
function mount(){
  if(!window.Landing||!window.LandingMobile||!window.DirectionB) return setTimeout(mount,60);
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}
mount();
</script></body></html>
