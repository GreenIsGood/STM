<!doctype html>
<html lang="en" dir="ltr" id="html-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — STM Studio</title>
<meta name="robots" content="noindex">
<!-- Unlike every other page here, this one can't use a relative stylesheet
     path: a 404 is served for the URL the visitor actually hit (at any
     depth), not for this file's real location, so relative paths would
     resolve against the wrong directory. Hardcode the deployment's base
     path instead — update this alongside BASE_PATH below if it ever moves
     (e.g. "" for a custom domain or user-site root). -->
<link rel="stylesheet" href="/STM/assets/css/styles.css">
</head>
<body>
<div class="stm-404">
  <div class="stm-brand__disc" style="width:48px;height:48px;">
    <span style="font-size:19px;">stm</span>
  </div>
  <span class="stm-eyebrow" id="stm-404-eyebrow">404 — Frame not found</span>
  <h1 class="stm-404__title" id="stm-404-title">Cut. That page isn&rsquo;t <span class="stm-accent">on the reel.</span></h1>
  <p class="stm-404__lede" id="stm-404-lede">The page you&rsquo;re looking for was never in the shot list.</p>
  <a class="stm-btn stm-btn--primary" id="stm-404-home" href="/STM/">Back to the homepage</a>
</div>

<script>
  // Same reasoning as the stylesheet link above: must match BASE_PATH there.
  var BASE_PATH = '/STM/';
  var isAr = location.pathname.indexOf(BASE_PATH + 'ar/') === 0 || location.pathname === BASE_PATH + 'ar';

  if (isAr) {
    document.getElementById('html-root').lang = 'ar';
    document.getElementById('html-root').dir = 'rtl';
    document.getElementById('stm-404-eyebrow').textContent = '404 — اللقطة غير موجودة';
    document.getElementById('stm-404-title').innerHTML = 'قطع. الصفحة دي مش <span class="stm-accent">في الريل.</span>';
    document.getElementById('stm-404-lede').textContent = 'الصفحة اللي بتدوّر عليها ماكانتش في شيت التصوير من الأساس.';
    var homeBtn = document.getElementById('stm-404-home');
    homeBtn.href = BASE_PATH + 'ar/';
    homeBtn.textContent = 'ارجع للصفحة الرئيسية';
  }
</script>
</body>
</html>
